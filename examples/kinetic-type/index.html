<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Letterform — A type playground</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0}button,a{font:inherit}a{color:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #ff6b50;outline-offset:4px}img{max-width:100%}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
body{background:#f6f4eb;color:#252524;font:15px/1.4 Arial,sans-serif}.wrap{max-width:1500px;margin:auto;padding:0 4vw}nav{display:flex;justify-content:space-between;padding:26px 0;border-bottom:2px solid}.brand{font-weight:800;font-size:23px}.tool{display:grid;grid-template-columns:260px 1fr;min-height:700px}.controls{padding:45px 30px 40px 0;border-right:2px solid}.controls h1{font-size:31px;line-height:1.05;letter-spacing:-.04em}.controls p{color:#5f5e58}.controls label{display:block;margin:28px 0 10px;font-weight:bold}.controls input{width:100%;accent-color:#ef573e}.controls button{display:block;background:transparent;border:1px solid;padding:12px 15px;width:100%;text-align:left;margin-top:8px}.controls button[aria-pressed=true]{background:#252524;color:white}.stage{display:flex;align-items:center;justify-content:center;min-width:0;padding:40px;overflow:hidden}.word{font-size:clamp(90px,15vw,230px);font-weight:800;letter-spacing:-.1em;line-height:.9;overflow-wrap:anywhere}.foot{display:flex;justify-content:space-between;border-top:2px solid;padding:22px 0}@media(max-width:700px){.tool{grid-template-columns:1fr}.controls{border:0;border-bottom:2px solid}.stage{min-height:330px;padding:20px}.word{font-size:23vw}.foot{gap:20px}}
</style></head><body><div class="wrap"><nav><span class="brand">letterform / lab</span><span>A small playground for big ideas</span></nav><main class="tool"><aside class="controls"><h1>Play with type.</h1><p>Choose a voice, then change the scale. Everything happens right here.</p><label for="words">Your word</label><input id="words" type="text" value="hello." maxlength="12"><label for="scale">Size</label><input type="range" id="scale" min="70" max="240" value="170"><label>Typeface</label><button class="face" data-font="Arial, sans-serif" aria-pressed="true">Sans / bold</button><button class="face" data-font="Georgia, serif" aria-pressed="false">Serif / classic</button><button class="face" data-font="monospace" aria-pressed="false">Mono / utility</button></aside><section class="stage" aria-label="Type preview"><div class="word" id="word">hello.</div></section></main><div class="foot"><span>Made for curious minds.</span><span>Browser-only demo</span></div></div><script>const w=document.getElementById('word');document.getElementById('words').addEventListener('input',e=>w.textContent=e.target.value||' ');document.getElementById('scale').addEventListener('input',e=>w.style.fontSize=`min(${e.target.value}px, 23vw)`);document.querySelectorAll('.face').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.face').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');w.style.fontFamily=b.dataset.font}))</script></body></html>

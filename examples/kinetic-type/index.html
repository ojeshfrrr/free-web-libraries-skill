<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Letterform: A type playground</title><meta name="description" content="An interactive typography playground."><style>
/* Hallmark · redesign: full · scope: app · signature: live specimen at display scale */
/* Critique: the former narrow sidebar made the interactive specimen feel secondary. */
:root{--paper:#f1eee4;--ink:#23382d;--panel:#dce4d8;--line:#829b89;--accent:#d04a35;--white:#fff;--focus:#b13428;--serif:Georgia,serif;--sans:Arial,sans-serif}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans)}.wrap{max-width:1520px;margin:auto;padding:0 5%}nav{height:84px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--ink)}nav span:last-child{color:var(--ink);font-size:14px}.brand{font-weight:800;font-size:23px;letter-spacing:-.045em}.tool{display:grid;grid-template-columns:minmax(0,1fr) 310px;min-height:650px;padding:32px 0;gap:32px}.stage{grid-column:1;grid-row:1;display:flex;justify-content:center;align-items:center;min-width:0;min-height:520px;background:var(--panel);padding:32px;overflow:clip;position:relative}.stage:before{content:'Aa';position:absolute;top:20px;left:24px;font:italic 36px var(--serif);color:var(--line)}.stage:after{content:'A small playground for big ideas';position:absolute;right:24px;bottom:20px;font-size:13px;color:var(--ink)}.word{font-family:var(--sans);font-size:clamp(72px,12vw,190px);font-weight:800;letter-spacing:-.08em;line-height:1;overflow-wrap:anywhere;max-width:100%;text-align:center}.controls{grid-column:2;grid-row:1;padding:28px 0 28px 8px}.controls h1{font:normal 48px/.98 var(--serif);letter-spacing:-.04em;margin:0 0 16px}.controls p{line-height:1.5;margin:0 0 28px}.controls label{display:block;margin:24px 0 8px;font-weight:700;font-size:14px}.controls input[type=text]{width:100%;background:transparent;color:var(--ink);border:0;border-bottom:1px solid var(--ink);padding:12px 0;outline-offset:4px}.controls input[type=range]{width:100%;accent-color:var(--accent)}.controls button{display:block;width:100%;padding:12px 16px;text-align:left;color:var(--ink);background:transparent;border:1px solid var(--line);margin-top:8px}.controls button:hover{border-color:var(--ink)}.controls button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--white)}.foot{border-top:1px solid var(--ink);display:flex;justify-content:space-between;padding:20px 0 32px;font-size:14px}.foot span:last-child{color:var(--ink)}@media(max-width:760px){nav span:last-child{display:none}.tool{display:flex;flex-direction:column;gap:0;padding:20px 0}.stage{order:0;min-height:320px}.controls{order:1;padding:32px 0}.controls h1{font-size:40px}.word{font-size:clamp(60px,17vw,120px)}.foot{gap:16px}}

*{box-sizing:border-box}html,body{overflow-x:clip}html{scroll-behavior:smooth}body{margin:0}button,input{font:inherit}button{cursor:pointer}a{color:inherit}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:4px}button:active{transform:translateY(1px)}button:disabled{opacity:.5;cursor:not-allowed}h1,h2{min-width:0;overflow-wrap:break-word;text-wrap:balance}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style></head><body><div class="wrap"><nav><span class="brand">letterform / lab</span><span>A small playground for big ideas</span></nav><main class="tool"><aside class="controls"><h1>Play with type.</h1><p>Choose a voice, then change the scale. Everything happens right here.</p><label for="words">Your word</label><input id="words" type="text" value="hello." maxlength="12"><label for="scale">Size</label><input type="range" id="scale" min="70" max="240" value="170"><label>Typeface</label><button class="face" data-font="Arial, sans-serif" aria-pressed="true">Sans / bold</button><button class="face" data-font="Georgia, serif" aria-pressed="false">Serif / classic</button><button class="face" data-font="monospace" aria-pressed="false">Mono / utility</button></aside><section class="stage" aria-label="Type preview"><div class="word" id="word">hello.</div></section></main><div class="foot"><span>Made for curious minds.</span><span>Browser-only demo</span></div></div><script>const w=document.getElementById('word');document.getElementById('words').addEventListener('input',e=>w.textContent=e.target.value||' ');document.getElementById('scale').addEventListener('input',e=>w.style.fontSize=`min(${e.target.value}px, 23vw)`);document.querySelectorAll('.face').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.face').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');w.style.fontFamily=b.dataset.font}))</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Weather Window — A quiet forecast concept</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0}button,a{font:inherit}a{color:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #ff6b50;outline-offset:4px}img{max-width:100%}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
body{background:#dfeaf5;color:#1a3554;font:15px/1.5 Arial,sans-serif}.wrap{max-width:1400px;margin:auto;padding:0 5vw}nav{display:flex;justify-content:space-between;padding:25px 0}.brand{font-weight:800;font-size:22px}.frame{background:#f8fafb;border-radius:28px;padding:45px;display:grid;grid-template-columns:1.2fr 1fr;gap:5%;min-height:610px}.location{color:#5e7791}.frame h1{font:normal 54px Georgia;margin:10px 0}.temp{font-size:clamp(100px,14vw,170px);font-weight:300;letter-spacing:-.09em;line-height:1;margin:30px 0}.info{display:flex;gap:45px;color:#5e7791}.info strong{display:block;color:#1a3554;font-size:20px}.scene{background:#aed5ed;border-radius:200px 200px 20px 20px;position:relative;overflow:hidden;min-height:500px}.sun{width:175px;height:175px;background:#f6d17a;border-radius:50%;position:absolute;top:80px;left:28%}.cloud{position:absolute;background:white;border-radius:100px;width:240px;height:68px;top:240px;left:19%;box-shadow:50px -30px 0 -8px white,100px 4px 0 -4px white}.hills{position:absolute;bottom:-150px;left:-30%;width:100%;height:350px;background:#8db6a7;border-radius:50%}.hills:after{content:'';position:absolute;left:65%;top:30px;width:100%;height:350px;background:#709c92;border-radius:50%}.forecast{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:25px 0 70px}.day{background:#f8fafb;border-radius:15px;padding:20px}.day strong{display:block;font-size:28px;margin-top:12px}.note{color:#5e7791}@media(max-width:700px){.frame{grid-template-columns:1fr;padding:25px}.scene{min-height:350px}.forecast{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap"><nav><span class="brand">weather window</span><span>Example forecast</span></nav><main><section class="frame"><div><span class="location">Somewhere by the sea</span><h1>Good morning.</h1><div class="temp">21°</div><p>Partly cloudy, with room for a little sunshine.</p><div class="info"><div>Feels like<strong>20°</strong></div><div>Breeze<strong>12 km/h</strong></div></div></div><div class="scene" role="img" aria-label="Illustration of sun, cloud and hills"><div class="sun"></div><div class="cloud"></div><div class="hills"></div></div></section><div class="forecast"><div class="day">Today<strong>21°</strong>Some sun</div><div class="day">Tomorrow<strong>19°</strong>Cloudy</div><div class="day">Friday<strong>22°</strong>Clear</div><div class="day">Saturday<strong>20°</strong>Light rain</div></div><p class="note">Fictional weather data for a design demonstration; not a live forecast.</p></main></div><script></script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Weather Window: A quiet forecast concept</title><meta name="description" content="An illustrated fictional weather forecast."><style>
/* Hallmark · redesign: full · scope: app · signature: the day's temperature leads a weather bulletin */
/* Critique: the former illustration consumed attention that belonged to the forecast. */
:root{--sky:#d8e8e7;--ink:#183c49;--sub:#3b626b;--paper:#f9f8ed;--rule:#8aaba7;--sun:#f1cd70;--cloud:#fff;--hill:#8ab5a5;--hill2:#528b79;--focus:#ad492d;--serif:Georgia,serif;--sans:Arial,sans-serif}
body{background:var(--sky);color:var(--ink);font:16px/1.5 var(--sans)}.wrap{max-width:1480px;margin:auto;padding:0 5%}nav{height:84px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--ink)}.brand{font-weight:800;font-size:22px;letter-spacing:-.04em}nav span:last-child{font-size:14px}.frame{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:7%;min-height:570px;padding:56px 0}.frame>div:first-child{display:flex;flex-direction:column;justify-content:center}.location{font-size:14px;color:var(--sub)}.frame h1{font:normal clamp(55px,6vw,86px)/1 var(--serif);letter-spacing:-.05em;margin:12px 0 0}.temp{font:normal clamp(130px,16vw,210px)/.9 var(--serif);letter-spacing:-.08em;margin:28px 0}.frame p{max-width:38ch;margin:0;color:var(--sub)}.info{display:flex;gap:60px;margin-top:36px;padding-top:20px;border-top:1px solid var(--rule);color:var(--sub)}.info strong{display:block;color:var(--ink);font:normal 24px var(--serif)}.scene{background:var(--paper);position:relative;min-height:500px;overflow:clip;border-radius:48% 48% 0 0}.sun{width:180px;height:180px;background:var(--sun);border-radius:50%;position:absolute;top:18%;left:32%}.cloud{position:absolute;background:var(--cloud);border-radius:100px;width:240px;height:68px;top:48%;left:24%;box-shadow:50px -30px 0 -8px var(--cloud),100px 4px 0 -4px var(--cloud)}.hills{position:absolute;bottom:-150px;left:-30%;width:100%;height:350px;background:var(--hill);border-radius:50%}.hills:after{content:'';position:absolute;left:65%;top:30px;width:100%;height:350px;background:var(--hill2);border-radius:50%}.forecast{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);margin:0 0 24px}.day{padding:24px;border-right:1px solid var(--rule)}.day:first-child{padding-left:0}.day:last-child{border:0}.day strong{display:block;font:normal 36px var(--serif);margin:8px 0}.note{font-size:14px;color:var(--sub);margin:0 0 48px}@media(max-width:700px){.frame{grid-template-columns:1fr;gap:32px;padding:40px 0}.frame h1{font-size:55px}.temp{font-size:140px}.scene{min-height:330px}.sun{width:120px;height:120px}.cloud{transform:scale(.7);transform-origin:left center}.forecast{grid-template-columns:1fr 1fr}.day:nth-child(2){border-right:0}.day:nth-child(-n+2){border-bottom:1px solid var(--rule)}.day:nth-child(3){padding-left:0}}

*{box-sizing:border-box}html,body{overflow-x:clip}html{scroll-behavior:smooth}body{margin:0}button,input{font:inherit}button{cursor:pointer}a{color:inherit}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:4px}button:active{transform:translateY(1px)}button:disabled{opacity:.5;cursor:not-allowed}h1,h2{min-width:0;overflow-wrap:break-word;text-wrap:balance}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style></head><body><div class="wrap"><nav><span class="brand">weather window</span><span>Example forecast</span></nav><main><section class="frame"><div><span class="location">Somewhere by the sea</span><h1>Good morning.</h1><div class="temp">21°</div><p>Partly cloudy, with room for a little sunshine.</p><div class="info"><div>Feels like<strong>20°</strong></div><div>Breeze<strong>12 km/h</strong></div></div></div><div class="scene" role="img" aria-label="Illustration of sun, cloud and hills"><div class="sun"></div><div class="cloud"></div><div class="hills"></div></div></section><div class="forecast"><div class="day">Today<strong>21°</strong>Some sun</div><div class="day">Tomorrow<strong>19°</strong>Cloudy</div><div class="day">Friday<strong>22°</strong>Clear</div><div class="day">Saturday<strong>20°</strong>Light rain</div></div><p class="note">Fictional weather data for a design demonstration; not a live forecast.</p></main></div><script></script></body></html>
